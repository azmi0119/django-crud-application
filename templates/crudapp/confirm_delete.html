
{% extends "crudapp/base.html" %}

{% block title %}
    Confirm delete
{% endblock %}

{% block content %}
<div class="cardx p-4 mx-auto" style="max-width: 600px">

    <h1 class="h3 title">Confirm deletion</h1>

    <p>
        Are you sure you want to delete
        {{ object_type }}
        <strong>{{ object }}</strong>?
    </p>

    <form method="post">
        {% csrf_token %}

        <button class="btn btn-danger">
            Yes, delete
        </button>

        <a class="btn btn-light" href="{{ cancel_url }}">
            Cancel
        </a>
    </form>

</div>
{% endblock %}
