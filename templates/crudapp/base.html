<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>{% block title %}Employee Manager{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <style>
            body {
                background: #f4f7fb;
            }
            .navbar-brand {
                font-weight: 700;
            }
            .cardx {
                background: white;
                border: 0;
                border-radius: 16px;
                box-shadow: 0 8px 28px #192d4b12;
            }
            .title {
                font-weight: 700;
                color: #1f3556;
            }
            .photo {
                width: 44px;
                height: 44px;
                border-radius: 50%;
                object-fit: cover;
            }
            .form-check ul {
                list-style: none;
                padding-left: 0;
                display: flex;
                gap: 1rem;
                flex-wrap: wrap;
            }
        </style>
    </head>
    <body>
        <nav class="navbar navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="{% url 'employee_list' %}">Employee Manager</a>
                <div class="navbar-nav flex-row gap-3">
                    <a class="nav-link" href="{% url 'employee_list' %}">Employees</a
                    ><a class="nav-link" href="{% url 'department_list' %}">Departments</a>
                </div>
            </div>
        </nav>
        <main class="container py-4">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
            {% endfor %}{% block content %}{% endblock %}
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
